name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    uses: johnhenry/workflows/.github/workflows/ci.yml@v1
    with:
      node-versions: '["26"]'
      os: '["ubuntu-latest"]'
      gate-commands: |
        npm run typecheck
        npm test
        npm run test:coverage
        npm run build
        node -e "import('./dist/index.js').then(m => { if (!m.QueryCache) throw new Error('missing QueryCache export'); console.log('ok'); })"

  workflow-lint:
    uses: johnhenry/workflows/.github/workflows/workflow-lint.yml@v1
